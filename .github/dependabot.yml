version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    groups:
      # Group all non-major bumps into one PR per week to cut noise.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Zagreb
    labels: [dependencies, github-actions]
